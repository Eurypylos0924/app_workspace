{% extends "base.html" %}{% block content %}<h1>{{ product.name }}</h1>
<p>분류: {{ product.category.name }}</p><p>가격: {{ product.price }}원</p>
<p>재고: {{ product.stock }}</p><p>{{ product.description }}</p>
<form method="post" action="{% url 'cart_add' product.pk %}">{% csrf_token %}<label>수량 <input type="number" name="quantity" min="1" max="99" value="1" required></label><button type="submit">장바구니 담기</button></form>
<a href="{% url 'product_list' %}">목록으로</a>{% endblock %}
