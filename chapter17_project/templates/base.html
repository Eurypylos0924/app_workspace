{% load static %}
<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Django Shop{% endblock %}</title>
<link rel="stylesheet" href="{% static 'css/site.css' %}"></head>
<body><header><nav><a href="{% url 'product_list' %}">Django Shop</a><a href="{% url 'cart_detail' %}">장바구니</a>
{% if user.is_authenticated %}<a href="{% url 'product_create' %}">상품 등록</a><span>{{ user.username }}</span>
<form method="post" action="{% url 'logout' %}">{% csrf_token %}<button type="submit">로그아웃</button></form>
{% else %}<a href="{% url 'signup' %}">회원가입</a><a href="{% url 'login' %}">로그인</a>{% endif %} <a href="{% url 'order_list' %}">내 주문</a>
</nav></header>
<main>{% block content %}{% endblock %}</main></body></html>
