[project]
name = "chapter08-orm-mysql"
version = "0.1.0"
description = "8장 Django ORM, Model, MySQL"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django==5.2.7",
    "mysqlclient>=2.2,<3",
    "python-dotenv>=1,<2",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-django>=4.8,<5",
]

# pytest 설정은 pytest.ini 대신 이 파일 한 곳에만 둡니다.
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-ra"
