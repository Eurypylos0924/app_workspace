<!DOCTYPE html>
<html>
  <head>
    <title>Page Title</title>
    <style>
      /*
      3)  명시적 중요도 (!important)가 가장 우선
      !important가 적용된 스타일이 있으면 무조건 우선 적용됨.
      */
      h1 {background-color: gold !important;} /* 강제 적용 */
      h1 {background-color: tomato;} 
    </style>
  </head>
  <body>

    <h1>강원도</h1>
    <h1>제주도</h1>

  </body>
</html>
