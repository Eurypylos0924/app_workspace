<!DOCTYPE html>
<html>
  <head>
    <title>Page Title</title>
    <style>
      /*
      CSS 캐스케이딩(Cascading) 개념
      CSS에서 여러 스타일 규칙이 동일한 요소에 적용될 때, 우선순위에 따라 최종 스타일을 결정하는 방식

      캐스케이딩(Cascading) 이란 단어 자체가 "폭포처럼 흐르는" 이라는 뜻
      나중에 작성된 스타일이 최종적으로 적용됨

      1) 특정성이 높은 스타일이 우선
      id 선택자(#id) > class 선택자(.class) > 태그 선택자(h1)


      2) 나중에 작성된 스타일이 우선
      같은 특정성을 가진 스타일이면, 뒤에 있는 스타일이 적용됨
      */
      h1 {background-color:gold;}
      h1 {background-color:tomato;}
    </style>
  </head>
  <body>

    <h1>강원도</h1>
    <h1>제주도</h1>

  </body>
</html>
