<!DOCTYPE html>

<html>

  <head>


    <title>Page Title</title>

    <style>

      /*
      Specificity (스페시피시티-명확성, 구체성) 
      어떤 스타일이 우선 적용될지를 정하는 점수 시스템

      선택자 유형	                                                        점수
      인라인 스타일 (style="...")                                   	       1000
      ID 선택자 (#id)	                                                      100
      클래스 선택자 (.class), 속성 선택자 ([attr]), 가상 클래스 (:hover)       10
      태그 선택자 (div, p, h1 등)	                                            1
      전체 선택자 (*)	                                                     0

      */
      div {background-color:gold; width:200px; height:200px;}    /*  1   */ 

      #main{background-color:pink;}         /*   100   */ 

      div#main{background-color:red;}       /*  101   */ 

      /*  

      div#main{background-color:red;}  공백이 없으면 자기자신

      div #main{background-color:red;}   div의 자식요소 중 id가 #main 요소 선택
      */
    </style>



  </head>


  <body>



    <div id="main">



    </div>



  </body>



</html>
