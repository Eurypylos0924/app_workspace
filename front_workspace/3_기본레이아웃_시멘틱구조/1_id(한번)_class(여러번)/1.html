<!DOCTYPE html>

<html>

  <head>

    <title>Page Title</title>

    <style>
      /*    

      id    #  문서내에서 1번 사용할 수 있음 

      class  .  여러번 사용할 수 있음

      */
      #news {background-color:gold;}

      #menu {background-color:skyblue;}

      .store {background-color:tomato;}

    </style>

  </head>

  <body>


    <p id="news">강원도</p>

    <p class="store">경기도</p>

    <p class="store">제주도</p>

    <p id="menu">충청남도</p>



  </body>

</html>
