<!DOCTYPE html>



<html>



  <head>



    <title>Page Title</title>



    <style>

      ul,li,ol {list-style:none; margin:0; padding:0;}



      #wrap {width:100%; padding:0 0 50px 0px; border:2px solid #666; margin:0 auto;}



      header {width:100%; height:150px; background-color:red; margin:0 auto;}

      header #box {width:1100px; height:100px;  background-color:gold; margin:0 auto;}

      header #logo {width:100px; height:50px;  background-color:purple;  margin:30px 0 0 0px;  float:left;}



      header #login {width:200px; height:30px;  background-color:white;  margin:30px 0 0 0px;  float:right;}

      header #login ul {font-size:11px; }

      header #login ul li {float:left; margin:0 5px;}



      header nav{width:100%; height:50px;  background-color:gray; margin:0 auto;}

      header nav ul {width:1000px; margin:0 auto; height:30px;}

      header nav ul li {float:left; margin:10px 25px; font-size:15px;}





      #slider {width:1100px; height:300px; background-color:cyan; margin:0 auto;}



      #contents {width:1100px; height:600px; background-color:tomato; margin:0 auto;}



      #product {width:900px; height:200px; background-color:gold; margin:50px 0 0 100px; float:left;}



      .new {width:100px; height:100px; background-color:blue; margin:20px 15px; float:left;}



      #product > div:nth-child(2){margin:20px 15px 0 75px; float:left;}







      #brand {width:900px; height:250px; background-color:yellow; margin:50px 0 0 100px; float:left;}



      .best {width:180px; height:130px; background-color:purple; margin:20px 10px; float:left;}



      #brand > div:nth-child(2){margin:20px 10px 0 60px; float:left;}







      #contents h3 {text-align:center;}







      footer {width:100%; height:100px; background-color: gray; margin:0 auto;}

      footer #box {width:1100px; height:100px;  margin:0 auto;  background-color:gold;}



    </style>



  </head>



  <body>







    <div id="wrap">







      <header>

        <div id="box">

          <div id="logo"></div>

          <div id="login">

            <ul>

              <li>로그인</li>

              <li>|</li>

              <li>회원가입</li>

              <li>|</li>

              <li>마이페이지</li>

            </ul>

          </div>



        </div>

        <nav>

          <ul>

            <li>경기도</li>

            <li>강원도</li>

            <li>경상북도</li>

            <li>전라도</li>

            <li>제주도</li>

          </ul>

        </nav>

      </header>







      <div id="slider"></div>  







      <section id="contents">







        <article id="product">



          <h3>신상품</h3>  



          <div class="new"></div>



          <div class="new"></div>



          <div class="new"></div>



          <div class="new"></div>



          <div class="new"></div>



          <div class="new"></div>



        </article>







        <article id="brand">



          <h3>베스트</h3>



          <div class="best"></div>



          <div class="best"></div>



          <div class="best"></div>



          <div class="best"></div>



        </article>







      </section>







      <footer>

        <div id="box"></div>

      </footer>











    </div>















  </body>



</html>
