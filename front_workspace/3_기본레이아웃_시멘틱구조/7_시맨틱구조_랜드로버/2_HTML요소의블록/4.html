<!DOCTYPE html>
<html>
  <head>
    <title>Page Title</title>
    <style>
      * {margin:0; box-sizing:border-box;}
      /*
      float: left   왼쪽 정렬
      float: right  오른쪽 정렬
      margin: 0 auto  중앙 정렬

      코드에서 float: left;와 margin: 0 auto;를 같이 사용하면서 레이아웃이 틀어지는 문제가 발생
      margin: 0 auto;와 float는 같이 쓰면 안됨

      이유:
      - 블록 요소는 부모 안에 딱 붙어 있어야 중앙 정렬이 가능함
      - 하지만 float를 사용하면, 요소가 부모와 떨어져서 '뜬 상태'가 되어 중앙 정렬이 안 됨
      */
      header {width:500px; height:100px; border:3px solid gold; float:left;}
      #slider {width:500px; height:100px; border:3px solid tomato; margin:0 auto;}
      main {width:500px; height:100px; border:3px solid green; float:left; }
      footer {width:500px; height:100px; border:3px solid blue; float:left;}

    </style>
  </head>
  <body>

    <header></header>

    <div id="slider"></div>

    <main></main>


    <footer></footer>





  </body>
</html>
