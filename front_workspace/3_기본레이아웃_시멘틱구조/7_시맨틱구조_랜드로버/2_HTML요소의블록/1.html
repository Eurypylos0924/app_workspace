  <!DOCTYPE html>
  <html>
    <head>
      <title>Page Title</title>
      <style>
        * {margin:0; box-sizing:border-box;}
        /* CSS에서 별도의 정렬을 지정하지 않으면 블록 요소는 왼쪽 정렬된다. */
        header {width:500px; height:100px; border:3px solid gold;}
        #slider {width:500px; height:100px; border:3px solid tomato;}
        main {width:500px; height:100px; border:3px solid green;}
        footer {width:500px; height:100px; border:3px solid blue;}

      </style>
    </head>
    <body>

      <header></header>

      <div id="slider"></div>

      <main></main>


      <footer></footer>





    </body>
  </html>
