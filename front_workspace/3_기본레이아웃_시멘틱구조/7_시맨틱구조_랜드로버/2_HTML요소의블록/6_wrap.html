
<!DOCTYPE html>
<html>
  <head>
    <title>Page Title</title>
    <style>
      * {margin:0; box-sizing:border-box;}

      /*
      #wrap은 전체 콘텐츠를 감싸서 중앙 정렬과 최대 너비 관리를 쉽게 해준다.
      반응형 웹에서는 화면 크기에 맞춰 유연하게 조정할 수 있어 필수로 사용한다.

      */
      #wrap {width:600px; height:auto; border:3px solid #666; margin:0 auto;}
      header {width:500px; height:100px; border:3px solid gold;}
      #slider {width:500px; height:100px; border:3px solid tomato; }
      main {width:500px; height:100px; border:3px solid green;  }
      footer {width:500px; height:100px; border:3px solid blue; }

    </style>
  </head>
  <body>
    <div id="wrap">
      <header></header>

      <div id="slider"></div>

      <main></main>
      <footer></footer>
    </div>




  </body>
</html>
