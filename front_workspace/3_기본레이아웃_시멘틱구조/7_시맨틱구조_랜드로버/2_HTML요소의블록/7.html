
<!DOCTYPE html>
<html>
  <head>
    <title>Page Title</title>
    <style>
      /* 모든 요소의 기본 여백 제거 및 박스 크기 계산 포함 */
      * {margin:0; box-sizing:border-box;}
      header {width:500px; height:100px; border:3px solid gold;}
      /* 상대 위치로 설정 (부모 요소를 기준으로 이동 가능) */
      #slider {width:500px; height:100px; border:3px solid tomato; position:relative;}
      main {width:500px; height:100px; border:3px solid green;  }
      footer {width:500px; height:100px; border:3px solid blue; }

    </style>
  </head>
  <body>
    <header></header>

    <div id="slider"></div>

    <main></main>
    <footer></footer>





  </body>
</html>
