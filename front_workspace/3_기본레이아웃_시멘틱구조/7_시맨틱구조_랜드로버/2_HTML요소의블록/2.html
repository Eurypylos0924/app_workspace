  <!DOCTYPE html>
  <html>
    <head>
      <title>Page Title</title>
      <style>
        * {margin:0;  box-sizing:border-box;}
       /* margin: 0 auto;를 사용하여 블록 요소를 수평 중앙 정렬함 */
        header {width:500px; height:100px; border:3px solid gold; margin:0 auto;}
        #slider {width:500px; height:100px; border:3px solid tomato; margin:0 auto;}
        main {width:500px; height:100px; border:3px solid green; margin:0 auto;}
        footer {width:500px; height:100px; border:3px solid blue; margin:0 auto;}

      </style>
    </head>
    <body>

      <header></header>

      <div id="slider"></div>

      <main></main>


      <footer></footer>





    </body>
  </html>
