<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가상 클래스 예제</title>
    <style>
      /*가상 클래스 (이벤트) 
      :hover   마우스 올렸을때
      :focus   입력요소에 초점을 맞췄을때
      :active   클릭했을 때 
      :visited   사용자가 방문한 적이 있는 링크
      */

      /* 방문하지 않은 링크 스타일 */
      a:link {
        color: blue;
      }

      /* 방문한 링크 스타일 */
      a:visited {
        color: purple;
      }

      /* 마우스를 올렸을 때 */
      button:hover {
        background-color: yellow;
      }

      /* 클릭(활성화) 상태 */
      button:active {
        background-color: red;
      }

      /* 포커스를 받았을 때 */
      input:focus {
        border: 2px solid green;
      }

      /* 홀수 번째 자식 선택 */
      li:nth-child(odd) {
        background-color: lightgray;
      }
    </style>
  </head>
  <body>

    <h2>가상 클래스 예제</h2>
    <a href="#">링크</a>
    <br><br>
    <button>마우스를 올려보세요</button>
    <br><br>
    <input type="text" placeholder="여기에 입력해보세요">
    <br><br>
    <ul>
      <li>아이템 1</li>
      <li>아이템 2</li>
      <li>아이템 3</li>
      <li>아이템 4</li>
    </ul>

  </body>
</html>
