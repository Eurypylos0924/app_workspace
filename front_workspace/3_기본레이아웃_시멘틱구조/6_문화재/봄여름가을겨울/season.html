<!DOCTYPE html>

<html>

  <head>

    <title>Page Title</title>

    <style>

      #imgbox {width:300px; height:200px; position:relative; border-radius:30px; overflow:hidden;}

      #imgbox > img {width:100%; height:100%; position:absolute; top:0; left:0;}

      #imgbox > img:not(:first-child) {display:none;}

      

      input[value="봄"]:checked ~ #imgbox > img[alt="봄"] {display:block;}

      input[value="여름"]:checked ~ #imgbox > img[alt="여름"] {display:block;}

      input[value="가을"]:checked ~ #imgbox > img[alt="가을"] {display:block;}

      input[value="겨울"]:checked ~ #imgbox > img[alt="겨울"] {display:block;}

    </style>

  </head>

  <body>

    

    <input type="radio" name="season" value="봄" checked>  <label>봄</label>

    <input type="radio" name="season" value="여름">  <label>여름</label>

    <input type="radio" name="season" value="가을">  <label>가을</label>

    <input type="radio" name="season" value="겨울">  <label>겨울</label>

    
    <div id="imgbox">

      <img src="https://img.freepik.com/free-photo/cherry-tree-flowers-ai-generated_268835-11258.jpg" alt="봄">

      <img src="https://mblogthumb-phinf.pstatic.net/MjAyMzA2MjdfMzEg/MDAxNjg3ODI3NDEyNjAz.naQy39u6xN1d2425cDjQW45yfp65nbjdHF2sgumNbEog.iNo6CAPqwB-Zr-rPC8rn3y77tl3vm2I05jAHKYN49cIg.JPEG.maum0577/1.jpg?type=w800" alt="여름">

      <img src="https://i.namu.wiki/i/24zF40aG-2YUcGQtHKvu94QWodwLaIj-uQ5SBjjLiXD670z2eycNrw9qDkPiniGk8mOCspnA-B_uFnL5nu17Eg.webp" alt="가을">

      <img src="https://i.namu.wiki/i/YdF0mzBNYXPmpP7XhQ-gEo5I80Xtpwq6zu_L0phHbAjioCCyzj9OgmwER-5Fxjo73P7C9AyAtK6L2u4XQxc9fw.webp" alt="겨울">

    </div>

  </body>

</html>
