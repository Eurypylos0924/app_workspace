# Docker Desktop에서 MySQL 8.4 컨테이너를 실행한다. 
# Docker Compose에서 실행할 서비스(컨테이너)를 정의한다. 
# services: 
# MySQL 데이터베이스 서비스를 정의한다. 

services:

  # MySQL 서버 컨테이너
  mysql:
    # Docker Hub에서 MySQL 8.4 이미지를 받아 사용합니다.
    image: mysql:8.4

    # 컨테이너 이름
    container_name: chapter07-mysql

    # Docker가 다시 켜지면 컨테이너도 자동으로 다시 시작합니다.
    restart: unless-stopped

    # MySQL 첫 실행 시 사용할 설정값 (.env 파일에서 읽음)
    # ${변수:?메시지}: 값이 없으면 메시지를 출력하고 중단합니다.
    environment:

      # 처음 만들 데이터베이스 이름
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}

      # 앱에서 쓸 일반 사용자 이름
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}

      # 일반 사용자 비밀번호
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}

      # 관리자(root) 비밀번호
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}

    # 내 PC(Windows)와 컨테이너를 연결하는 포트
    ports:

      # 127.0.0.1: 내 PC에서만 접속 가능 (외부 접속 차단)
      # ${MYSQL_PORT:-3307}: .env의 MYSQL_PORT, 없으면 3307
      # 3306: MySQL 컨테이너 안쪽의 기본 포트
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"

    # 데이터 보관 위치와 초기 SQL 연결
    volumes:

      # MySQL 데이터를 Docker 볼륨에 저장합니다. (컨테이너를 지워도 데이터 유지)
      - mysql_data:/var/lib/mysql

      # 내 sql 폴더를 MySQL 초기화 폴더에 연결합니다.
      # :ro 는 읽기 전용이라는 뜻입니다.
      # 이 폴더의 SQL은 데이터베이스를 처음 만들 때 한 번만 실행됩니다.
      - ./sql:/docker-entrypoint-initdb.d:ro

    # MySQL이 정상적으로 켜졌는지 주기적으로 확인합니다.
    healthcheck:

      # CMD-SHELL: 컨테이너 안에서 쉘 명령을 실행합니다.
      # $$: Docker Compose가 $ 기호를 바꾸지 않도록 씁니다.
      # mysqladmin ping: MySQL이 응답하는지 확인합니다.
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysqladmin ping -h 127.0.0.1 -u\"$$MYSQL_USER\" --silent"]

      # 10초마다 확인
      interval: 10s

      # 응답을 5초까지 기다림
      timeout: 5s

      # 12번 연속 실패하면 unhealthy로 표시
      retries: 12

      # 처음 30초 동안은 실패해도 센 횟수에 넣지 않음
      start_period: 30s

# Docker Compose가 관리하는 저장 공간
volumes:

  # MySQL 데이터 저장용 볼륨
  mysql_data:
