<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agentic AI 업무 지원</title>
<style>body{font-family:Arial,'Malgun Gothic',sans-serif;background:#f3f5f8;color:#1f2937;margin:0}.wrap{max-width:940px;margin:32px auto;padding:20px}header{background:#172b4d;color:white;padding:26px;border-radius:14px}h1{margin:0 0 8px}main{background:white;padding:24px;margin-top:18px;border-radius:14px;box-shadow:0 3px 14px #0001}#history{height:440px;overflow:auto;border:1px solid #ddd;border-radius:8px;padding:18px}.bubble{padding:12px 15px;border-radius:10px;margin:10px 0;white-space:pre-wrap;line-height:1.6}.user{background:#e6f0ff;margin-left:15%}.bot{background:#f1f3f5;margin-right:10%}.bot{white-space:normal;overflow-wrap:anywhere}.bot p{margin:0 0 10px;line-height:1.7}.bot p:last-child{margin-bottom:0}.bot ul,.bot ol{padding-left:23px;margin:8px 0}.bot li{margin-bottom:6px;line-height:1.65}.bot strong{font-weight:700}.bot h1,.bot h2,.bot h3{margin:12px 0 8px}.bot pre{white-space:pre-wrap;overflow-wrap:anywhere}.bot a{overflow-wrap:anywhere}.row{display:flex;gap:10px;margin-top:14px}input{flex:1;padding:13px;font-size:16px;border:1px solid #bbb;border-radius:8px}button{padding:12px 22px;background:#174c87;color:white;border:0;border-radius:8px;cursor:pointer}button:disabled{opacity:.5}.meta{font-size:12px;color:#536274;margin:4px 0 14px}.hint{font-size:14px;color:#6b7280}</style></head><body><div class="wrap"><header><h1>Agentic AI 통합 업무 지원</h1><div>Django · ChromaDB · OpenAI 임베딩 · PDF · 게시글 질의응답</div></header><main><p class="hint">예: 환불 정책 / 게시판에 등록된 답글 내용 / 세금계산서</p><div id="history" aria-live="polite"></div><form id="chatForm" class="row"><input id="question" maxlength="3000" placeholder="질문을 입력한다" required autocomplete="off"><button id="send" type="submit">전송</button></form></main></div><script>
function cookie(name){return document.cookie.split('; ').find(s=>s.startsWith(name+'='))?.split('=')[1]||''}
const history=document.getElementById('history'),form=document.getElementById('chatForm'),input=document.getElementById('question'),send=document.getElementById('send');
function add(text,cls,meta='',safeHtml=null){let b=document.createElement('div');b.className='bubble '+cls;if(cls==='bot' && typeof safeHtml==='string'){b.innerHTML=safeHtml}else{b.textContent=text};history.appendChild(b);if(meta){let m=document.createElement('div');m.className='meta';m.textContent=meta;history.appendChild(m)}history.scrollTop=history.scrollHeight}
form.addEventListener('submit',async e=>{e.preventDefault();let q=input.value.trim();if(!q)return;add(q,'user');input.value='';send.disabled=true;try{let r=await fetch('/rag/api/chat/',{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':decodeURIComponent(cookie('csrftoken'))},body:JSON.stringify({message:q})});let d=await r.json();if(!r.ok)throw Error(d.error||'HTTP '+r.status);let sources=(d.sources||[]).map(x=>(x.kind==='board' ? '게시글 #'+x.board_id+' '+x.title : (x.display_source||x.source)+' p.'+x.page)).join(' / ');let retrieval='';let status=d.status==='excerpt'?' · 원문 발췌(LLM 미생성)':d.status==='generated'?' · LLM 생성':'';add(d.answer,'bot','에이전트: '+d.agent+retrieval+status+(sources?' · 출처: '+sources:''),d.answer_html)}catch(err){add('오류: '+err.message,'bot')}finally{send.disabled=false;input.focus()}});
</script></body></html>
