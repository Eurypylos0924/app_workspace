# Production only: docker compose -f compose.prod.yaml up -d --build
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?required}
      MYSQL_USER: ${MYSQL_USER:?required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?required}
    volumes:
      - mysql_prod_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysqladmin ping -h 127.0.0.1 -u root --silent'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  web:
    build: .
    restart: unless-stopped
    env_file: [.env]
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      DJANGO_DEBUG: "False"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./chroma_store:/app/chroma_store
      - ./media:/app/media
      - static_prod_data:/app/staticfiles
    expose: ["8000"]
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on: [web]
    ports: ["80:80"]
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_prod_data:/app/staticfiles:ro
      - ./media:/app/media:ro
volumes:
  mysql_prod_data:
  static_prod_data: