
# 제17장 Django 쇼핑몰 통합 테스트용 MySQL 8.4
services:

   
  mysql:
    # MySQL 8.4 이미지
    image: mysql:8.4

    # 생성되는 컨테이너의 이름을 지정한다.
    container_name: django_members_boards_rag
    # 컨테이너 재시작 정책
    restart: unless-stopped

    # MySQL 데이터베이스 및 사용자 설정
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}

    # Windows 호스트 3310 → 컨테이너 3306
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3310}:3306"

    # 데이터베이스 파일 영구 보관
    volumes:
      - django_members_boards_rag_mysql_data:/var/lib/mysql

    # MySQL 서버 상태 확인
    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysqladmin ping -h 127.0.0.1 -u root --silent'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

# Docker 데이터 볼륨 정의
volumes:
  django_members_boards_rag_mysql_data:
