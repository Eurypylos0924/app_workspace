[project]
name = "django-member-board-mtv"
version = "0.1.0"
description = "Django Member Board Project configured with uv, Python 3.12, MySQL 8.4 Docker, and mysqlclient"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "django==5.2.7",
    "mysqlclient>=2.2.7,<3",
    "python-dotenv==1.1.1",
    "djangorestframework>=3.16,<3.17",
    "pillow>=13.0.0",
    "chromadb>=1.0,<2",
    "pypdf>=5,<7",
    "openai>=1.100,<3",
    "Markdown>=3.7,<4",
    "bleach>=6,<7",
    "gunicorn>=23,<24",
]


[dependency-groups]
dev = [
    "pytest==8.3.4",  # 9.x 대신 8.x 버전으로 고정
    "pytest-django>=4.9.0,<5.0",
]


[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
# addopts = "-ra"
addopts = "--reuse-db -ra"


