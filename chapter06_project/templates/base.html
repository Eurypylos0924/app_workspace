{% load static %}
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}상품 관리{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'shop/style.css' %}">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="{% url 'shop:product_list' %}">Chapter 06 Shop</a>
      <span class="chapter">Django MTV 실습</span>
    </div>
  </header>
  <main class="container">{% block content %}{% endblock %}</main>
  <footer class="container footer">제6장 · Django MTV · URL · View · Template</footer>
</body>
</html>
